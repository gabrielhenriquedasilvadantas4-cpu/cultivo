html{scroll-behavior:smooth}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}#view.fx>*{animation:in .35s ease both}dialog[open]{animation:in .25s}.card,.cell,.btn,.chip,.nv,.pill,.sw{transition:transform .2s,box-shadow .2s,border-color .2s,background .2s,color .2s}.card:hover{transform:translateY(-2px)}.cell:hover{transform:scale(1.03);border-color:var(--ac)}.btn:active{transform:scale(.95)}.chip:hover{transform:translateX(3px)}.hero{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;margin-bottom:18px;cursor:pointer;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 24%,var(--card)),color-mix(in srgb,var(--g) 16%,var(--card)));border:1px solid var(--line);transition:transform .2s}.hero:hover{transform:translateY(-2px)}.hero h2{font-size:22px}.hero p{margin:2px 0 0;color:var(--mu);font-size:14px}.av{width:64px;height:64px;border-radius:50%;background:var(--card2) center/cover;display:flex;align-items:center;justify-content:center;font-size:26px;font-family:Fraunces,Georgia,serif;border:2px solid var(--ac);flex:none}.mini{position:relative;width:58px;height:58px;flex:none}.mini svg{transform:rotate(-90deg)}.mini b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px}.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw:hover{transform:scale(1.15)}.sw.on{border-color:var(--tx)}.vt{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}.vt button{border:0;background:none;padding:5px 9px;border-radius:7px;cursor:pointer;color:var(--mu);display:flex}.vt .on{background:var(--card2);color:var(--ac)}#cf{position:fixed;inset:0;pointer-events:none;z-index:99}.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:var(--card);border:1px solid var(--g);padding:12px 22px;border-radius:30px;box-shadow:var(--sh);z-index:100;animation:in .4s}@media(pr :root[data-pal="nectar"]{--bg:#070b1a;--side:#0d1326;--card:#111a30;--card2:#18233f;--line:#22304f;--tx:#e8f0ff;--mu:#8a9bbd;--g:#38bdf8;--g1:#3b82f6;--g2:#2563eb;--ac:#22d3ee;color-scheme:dark}

:root:not([data-pal=""]) body{background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--ac) 24%,transparent),transparent),radial-gradient(700px 500px at -10% 110%,color-mix(in srgb,var(--g) 20%,transparent),transparent),var(--bg)}
:root:not([data-pal=""]) .btn.pri{background:linear-gradient(120deg,var(--ac),var(--g1));color:#fff}

.pal{display:flex;gap:8px;flex-wrap:wrap}.pb{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:6px 12px 6px 6px;cursor:pointer}.pb i{width:26px;height:26px;border-radius:50%;display:block}.pb.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 40%,transparent)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:2px 2px 8px}.msg{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}.msg.u{align-self:flex-end;background:linear-gradient(120deg,var(--ac),var(--g1));color:#fff;border:0}.msg ol{margin:6px 0 0;padding-left:20px}.msg li{margin:7px 0}.msg details{color:var(--mu);margin-top:3px}.msg summary{cursor:pointer;color:var(--ac)}.msg .m{font-size:12px;color:var(--mu);margin-top:8px}

<aside id="nav"></aside>
<main><div class="top"><h1 id="ttl"></h1><div id="tools" style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div id="view"></div></main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const fromIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const ft=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const PR={alta:'Alta',imp:'Importante',flex:'Flexível'},RK={alta:0,imp:1,flex:2};
const IC={user:`<circle cx='12' cy='8' r='4'/><path d='M4 21c0-4 4-7 8-7s8 3 8 7'/>`,cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',leaf:'<path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14zM5 19l7-7"/>',spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;

/* ---------- estado ---------- */
let S;const KEY='cultivo.v1';
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S){const t=today();S={theme:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark',
  goals:[{id:'g1',name:'Contabilidade',hours:20,steps:[{t:'Ler capítulo 1',d:true},{t:'Lista de exercícios',d:false},{t:'Revisão para a prova',d:false}]},{id:'g2',name:'Inglês',hours:10,steps:[]}],
  tasks:[{id:'t1',title:'Aula de Contabilidade',date:t,time:'09:00',dur:90,prio:'imp',goal:'g1',done:false},{id:'t2',title:'Entregar relatório',date:t,time:'14:00',dur:60,prio:'alta',goal:'',done:false},{id:'t3',title:'Estudar vocabulário',date:t,time:'',dur:30,prio:'flex',goal:'g2',done:false},{id:'t4',title:'Resolver exercícios',date:t,time:'',dur:60,prio:'imp',goal:'g1',done:false},{id:'t5',title:'Pagar boleto',date:addD(t,-1),time:'',dur:15,prio:'alta',goal:'',done:false}],
  sessions:[],pending:null,_new:1}}}
function save(){S._u=Date.now();delete S._new;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}
load();S.profile=S.profile||{name:'',photo:'',motto:'',ac:''};applyLook();
const U={view:'cal',mode:'month',fmt:'cal',cur:today()};
const TITLES={me:'Perfil',cal:'Início',tasks:'Tarefas',goals:'Metas',focus:'Modo Foco',ai:'Assistente de Planejamento'};

/* ---------- utilidades ---------- */
const tasksOn=d=>S.tasks.filter(t=>t.date===d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')||RK[a.prio]-RK[b.prio]);
const gName=id=>(S.goals.find(g=>g.id===id)||{}).name||'';
const gSec=id=>S.sessions.filter(s=>s.goal===id).reduce((a,s)=>a+s.sec,0);
const gPct=g=>{const hp=Math.min(1,gSec(g.id)/3600/g.hours);if(!g.steps.length)return hp;return(hp+g.steps.filter(s=>s.d).length/g.steps.length)/2};
const chip=t=>`<div class="chip p-${t.prio} ${t.done?'done':''}" onclick="event.stopPropagation();openTask('${t.id}')">${t.time?t.time+' ':''}${esc(t.title)}</div>`;
const mins=s=>s>=3600?Math.floor(s/3600)+'h'+String(Math.round(s%3600/60)).padStart(2,'0'):Math.round(s/60)+' min';
const fmtD=(s,o)=>fromIso(s).toLocaleDateString('pt-BR',o);

/* ---------- navegação ---------- */
function renderNav(){$('#nav').innerHTML='<div class="logo">'+ic('leaf')+'Cultivo</div>'+[['cal','cal'],['tasks','list'],['goals','target'],['focus','leaf'],['stats','chart'],['ai','spark'],['me','user']].map(([v,i])=>`<button class="nv ${U.view===v?'on':''}" onclick="U.view='${v}';render()" title="${TITLES[v]}">${ic(i)}<span>${TITLES[v]}</span></button>`).join('')+'<div class="sp"></div><button class="nv" onclick="toggleTheme()" title="Alternar tema">'+ic('sun')+'<span>Tema claro/escuro</span></button>'}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';S.pal='';applyLook();save()}
function go(d,m){U.cur=d;U.mode=m;U.view='cal';render()}
function step(n){const d=fromIso(U.cur);if(U.mode==='month')d.setMonth(d.getMonth()+n,1);else d.setDate(d.getDate()+n*(U.mode==='week'?7:1));U.cur=iso(d);render()}
function render(){renderNav();$('#ttl').textContent=TITLES[U.view];
 let tools='';
 if(U.view==='cal')tools=`<button class="btn" onclick="step(-1)">‹</button><button class="btn" onclick="U.cur=today();render()">Hoje</button><button class="btn" onclick="step(1)">›</button><div class="tabs">${['day','week','month'].map(m=>`<button class="${U.mode===m?'on':''}" onclick="U.mode='${m}';render()">${{day:'Dia',week:'Semana',month:'Mês'}[m]}</button>`).join('')}</div><input type="date" class="q" style="min-width:0" title="Ir para uma data" value="${U.cur}" onchange="if(this.value){U.cur=this.value;render()}">`;
 if(U.view==='cal'){if(U.fmt==='list')tools='';tools=vt()+tools}if(U.view==='cal'||U.view==='tasks')tools+=`<input class="q" id="qa" placeholder="Nova tarefa… ex.: Revisar 15:30 (Enter)" onkeydown="if(event.key==='Enter')quick(this)"><button class="btn pri" onclick="newTask()">+ Nova</button>`;

<div class="card"><h3>Tempo por meta</h3>${rows.map(([k,v],i)=>`<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(k)}</span><span style="color:var(--mu)">${mins(v)}</span></div><div class="bar"><i style="width:${v/rows[0][1]*100}%;background:${COL[i%7]}"></i></div></div>`).join('')||'<div class="empty">—</div>'}</div></div>
<div class="sec">Foco por dia</div><div class="card"><div class="wk" style="height:130px;gap:${nd>7?2:6}px">${per.map((p,i)=>`<div title="${fmtD(days[i],{day:'numeric',month:'short'})}: ${mins(p)}"><i style="height:${p/mx*100}px"></i>${nd<=7?fmtD(days[i],{weekday:'narrow'}):i%5==0?fromIso(days[i]).getDate():'&nbsp;'}</div>`).join('')}</div></div>
<div class="sec">Tarefas concluídas por meta</div><div class="card">${tr.map(([k,v],i)=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(k)}</span><span style="color:var(--mu)">${v}</span></div><div class="bar"><i style="width:${v/tr[0][1]*100}%;background:${COL[i%7]}"></i></div></div>`).join('')||'<div class="empty">Nenhuma tarefa concluída neste período.</div>'}</div>`};

/* ---------- sincronização entre aparelhos (conta do usuário) ---------- */
var SY={ref:null,t:null};
function syBadge(k){let b=document.getElementById('syb');if(!b){b=document.createElement('div');b.id='syb';b.style.cssText='position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--card);color:var(--mu);border:1px solid var(--line);opacity:.9;pointer-events:none';document.body.appendChild(b)}
 b.textContent={local:'Salvo só neste aparelho',sync:'☁ Sincronizando…',ok:'☁ Sincronizado',err:'⚠ Sem sincronia (salvo aqui)',big:'⚠ Dados grandes demais para a nuvem'}[k]||''}
function push(){if(!SY.ref)return;clearTimeout(SY.t);syBadge('sync');SY.t=setTimeout(doPush,1200)}
async function doPush(){try{const j=JSON.stringify(S);if(j.length>230000){syBadge('big');return}await SY.ref.set({json:j,u:S._u||0});syBadge('ok')}catch(e){syBadge('err')}}
function adopt(d){S=d;delete S._new;S.profile=S.profile||{name:'',photo:'',motto:'',ac:''};applyLook();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();toast('Dados atualizados da nuvem ☁')}
async function initSync(){try{
 const db=await claude.use('db'),user=await claude.use('user'),id=user?await user.id():null;
 if(!db||!id){syBadge('local');return}
 SY.ref=db.collection('data/users/'+id).doc('cultivo');
 let first=true;
 SY.ref.onSnapshot(snap=>{
  let c=null;try{c=snap.exists?JSON.parse(snap.data().json):null}catch(e){}
  const cu=c?(c._u||0):0,lu=S._u||0;
  if(first){first=false;
   if(!c){if(S._new){syBadge('ok');return}S._u=S._u||Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syBadge('sync');doPush();return}
   if(S._new||(lu&&cu>lu)){adopt(c);syBadge('ok');return}
   if(!lu){syBadge('ok');ask('Este aparelho tem dados diferentes dos que estão na nuvem. Usar os da nuvem? Os daqui ficam guardados em um backup automático.',()=>{autoBak(1);adopt(c);syBadge('ok')});return}
   if(lu>cu){syBadge('sync');doPush();return}
   syBadge('ok');return}
  if(c&&cu>lu)adopt(c);else syBadge('ok')
 },()=>syBadge('err'));
}catch(e){syBadge('local')}}
initSync();
render();
</script>
<script>
syBadge=function(k){
  var b=document.getElementById('syb');
  if(!b){
    b=document.createElement('div');b.id='syb';
    b.style.cssText='position:fixed;left:10px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--card);color:var(--mu);border:1px solid var(--line);opacity:.9;pointer-events:none';
    document.body.appendChild(b);
  }
  b.textContent={err:'⚠ Sem sincronia (salvo aqui)',big:'⚠ Dados grandes demais para a nuvem'}[k]||'';
  b.style.display=(k==='err'||k==='big')?'':'none';
};syBadge('local');
</script>

function bkState(){var d=S.lastExp?(Date.now()-S.lastExp)/864e5:99;return d>=7?2:d>=5?1:0}
function topBtns(){
  var el=document.getElementById('topb');
  if(!el){el=document.createElement('div');el.id='topb';document.body.appendChild(el)}
  var s=bkState();
  var tip=s==2?'Backup atrasado! Toque para fazer agora':s==1?'O prazo do backup está acabando, toque para fazer':'Backup em dia';
  el.innerHTML='<button class="tb'+(s?' w'+s:'')+'" title="'+tip+'" onclick="exportBak()">'+ic('dl')+(s?'<i></i>':'')+'</button><button class="tb" title="Alternar tema claro/escuro" onclick="toggleTheme()">'+ic('sun')+'</button>';
}
var _render=render;render=function(){_render();topBtns()};
var _save=save;save=function(){_save();topBtns()};
setInterval(topBtns,60000);
render();
if(bkState()>0)toast('⚠ Faça seu backup para não perder seus dados');
